<!DOCTYPE html>
<html>
<head>
    <title>AI Loan Eligibility Predictor</title>
</head>
<body>
    <h2>Student Loan Eligibility Checker</h2>

    <form action="/predict" method="post">
        Age: <input type="number" name="age" required><br><br>
        Academic Score: <input type="number" name="academic_score" required><br><br>
        Family Income: <input type="number" name="family_income" required><br><br>
        Existing Loans: <input type="number" name="existing_loans" required><br><br>
        College Rank: <input type="number" name="college_rank" required><br><br>
        Co-applicant Income: <input type="number" name="coapplicant_income" required><br><br>
        Location Tier (1/2/3): <input type="number" name="location_tier" required><br><br>

        <button type="submit">Check Eligibility</button>
    </form>

    <h3>{{ prediction_text }}</h3>

</body>
</html>
